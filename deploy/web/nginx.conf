map $http_upgrade $archify_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    auth_basic "Archify Test";
    auth_basic_user_file /etc/nginx/web-users;
    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /internal/ { return 404; }
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $archify_connection;
        proxy_pass http://control-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Archify-User $remote_user;
        proxy_set_header Authorization "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
