name: archify-test
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: archify
      POSTGRES_USER: archify
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U archify -d archify']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
    restart: unless-stopped
  control-api:
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      PORT: 3001
      WORKER_TOKEN_FILE: /run/secrets/worker_token
      ANDROID_WORKER_TOKEN_FILE: /run/secrets/android_worker_token
      WEB_ORIGINS: '${ARCHIFY_WEB_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://127.0.0.1:8080,http://localhost:8080}'
      ARCHIFY_CONFIG: /app/config/integrations.json
    entrypoint: [node, --import, tsx, services/control-api/src/container.ts]
    secrets: [db_password, worker_token, android_worker_token]
    volumes: ['./config:/app/config:ro', './.local/integration-secrets:/run/integration-secrets:ro']
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health',{signal:AbortSignal.timeout(3000)}).then(async r=>{if(!r.ok||(await r.json()).status!=='ready')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [database, outbound]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  launcher:
    build:
      context: .
      dockerfile: services/launcher/Dockerfile
    user: '${ARCHIFY_UID:-1000}:${ARCHIFY_GID:-1000}'
    group_add: ['${ARCHIFY_DOCKER_GID:-984}']
    environment:
      CONTROL_API_URL: http://control-api:3001
      WORKER_TOKEN_FILE: /run/secrets/worker_token
      RUNNER_IMAGE: archify-runner:local
    secrets: [worker_token]
    volumes: ['/var/run/docker.sock:/var/run/docker.sock']
    depends_on: [control-api]
    networks: [outbound]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  runner-image:
    profiles: [build]
    image: archify-runner:local
    build:
      context: .
      dockerfile: services/runner/Dockerfile
  web:
    profiles: [share]
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    ports: ['${ARCHIFY_WEB_BIND:-127.0.0.1}:8080:8080']
    volumes: ['./.local/web-users:/etc/nginx/web-users:ro']
    depends_on: [control-api]
    networks: [outbound]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  database: {internal: true}
  outbound: {}
volumes:
  postgres_data: {}
secrets:
  db_password: {file: ./.local/db-password}
  worker_token: {file: ./.local/worker-token}
  android_worker_token: {file: ./.local/android-worker-token}
